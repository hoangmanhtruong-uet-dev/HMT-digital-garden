# Production profile — kích hoạt bằng: --spring.profiles.active=prod
# Hoặc biến môi trường SPRING_PROFILES_ACTIVE=prod

# KHÔNG tự động thay đổi schema ở production — chỉ validate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Tắt lazy initialization ở production để phát hiện lỗi sớm khi startup
spring.main.lazy-initialization=false
