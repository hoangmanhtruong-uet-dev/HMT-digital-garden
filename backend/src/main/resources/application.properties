# Database — MySQL (Aiven hoặc tương thích), cấu hình qua biến môi trường
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA Configuration
# ddl-auto=update cho dev; ở production nên chạy với profile prod (validate)
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Tăng tốc startup - giảm connection timeout để không chờ quá lâu
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.initialization-fail-timeout=60000
spring.datasource.hikari.maximum-pool-size=3
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server Port (Render gán động qua biến $PORT, local dev dùng 8080)
server.port=${PORT:8080}
# Bind trên tất cả interfaces — bắt buộc để Render detect được port
server.address=0.0.0.0

# Tối ưu hóa bộ nhớ cho môi trường RAM thấp (Render 512MB)
server.tomcat.threads.max=20
spring.main.lazy-initialization=true

# AI Configuration (Gemini API)
# Get your key at: https://aistudio.google.com/
gemini.api.key=${GEMINI_API_KEY}

# Admin authentication (configured through environment, never in client code)
admin.pin=${ADMIN_PIN:}

# Cloudinary Configuration
# Lấy credentials tại: https://cloudinary.com → Dashboard
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# CORS / WebSocket origin whitelist — ở production đặt ví dụ:
# ALLOWED_ORIGINS=https://yourdomain.com,https://www.yourdomain.com
allowed.origins=${ALLOWED_ORIGINS:*}

# (Tùy chọn) Passcode bắt buộc khi CONNECT WebSocket /ws-location.
# Để trống nếu tính năng location dùng công khai (mặc định).
ws.passcode=${WS_PASSCODE:}
